<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASE-Lab. Campus</title>
<link rel="icon" href="img/logo.webp">
<meta name="robots" content="noindex">
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#5b2fd4,#8e6ae6);color:#fff;
    font-family:"Noto Sans JP",system-ui,sans-serif}
  .gate{text-align:center}
  .gate .word{font-family:Teko,sans-serif;font-size:2.4rem;letter-spacing:1px}
  .gate p{opacity:.85;font-size:.85rem;margin-top:6px}
  .gate a{color:#fff}
</style>
</head>
<body>
<!-- Campus 入口ゲート: ログイン済み→dashboard / 未ログイン→login に振り分ける。
     data.js は読まず、app.js の STORE_KEY と同じキーだけを見て即リダイレクトする。 -->
<div class="gate">
  <div class="word">ASE-Lab. Campus</div>
  <p>読み込み中…</p>
  <noscript><p>JavaScript を有効にするか、<a href="login.html">こちらからログイン</a>してください。</p></noscript>
</div>
<script>
  // キーは assets/app.js の STORE_KEY ("ase_reboot_user_v2") と一致させること
  var hasUser = false;
  try { hasUser = !!JSON.parse(localStorage.getItem("ase_reboot_user_v2")); } catch (e) { hasUser = false; }
  location.replace(hasUser ? "dashboard.html" : "login.html");
</script>
</body>
</html>
