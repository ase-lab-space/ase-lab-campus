<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゼミ詳細 | ASE-Lab. Campus</title>
<link rel="icon" href="img/logo.webp">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500&family=Lato:wght@400;700&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
.sem-wrap { max-width: 880px; margin: 0 auto; }
.sem-head { margin: 24px auto 0; padding: 0; overflow: hidden; }
.sem-head .hero { position: relative; aspect-ratio: 21/9; }
.sem-head .hero img, .sem-head .hero .sem-fallback { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.sem-head .hero .sem-fallback { display: flex; align-items: center; justify-content: center; gap: 14px; }
.sem-head .hero .status-badge {
  position: absolute; top: 14px; left: 14px; z-index: 2;
  padding: 4px 14px; border-radius: 999px; color: #fff; font-size: .78rem; font-weight: 700;
}
.sem-head .h-body { padding: 20px 28px 26px; }
.sem-head .h-id { font-family: var(--font-title); font-weight: 700; font-size: .74rem; letter-spacing: 1px; color: var(--faint); }
.sem-head h1 { font-size: 1.5rem; margin: 3px 0 10px; }
.sem-head .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.sem-head p.ov { margin: 0; font-size: .92rem; line-height: 1.75; }
.sem-head .cta { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

.info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 20px; }
@media (max-width: 640px) { .info-grid { grid-template-columns: 1fr; } }
.info-grid .row { display: flex; gap: 10px; padding: 9px 2px; border-bottom: 1px dashed var(--line); font-size: .88rem; }
.info-grid .row .k { color: var(--muted); flex: none; width: 84px; font-weight: 600; }
.info-grid .row .v { flex: 1; }

.card.block { max-width: 880px; margin: 16px auto 0; padding: 20px 26px; }
.card.block > h2 { font-size: 1.05rem; margin: 0 0 4px; display: flex; align-items: baseline; gap: 10px; }
.card.block > h2 .sub { font-size: .74rem; color: var(--faint); font-weight: 400; }

/* 講義スケジュール(タイムライン) */
.sylla { margin-top: 14px; }
.sylla .s {
  display: flex; gap: 14px; align-items: flex-start;
  padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff;
}
.sylla .s + .s { margin-top: 8px; }
.sylla .s.done { background: var(--primary-soft); border-color: transparent; }
.sylla .s.next { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
.sylla .s .no { font-family: var(--font-title); font-weight: 800; font-size: 1rem; color: var(--primary); flex: none; width: 34px; text-align: center; }
.sylla .s .c { flex: 1; min-width: 0; }
.sylla .s .c .tp { font-size: .9rem; font-weight: 600; }
.sylla .s .c .dt { font-size: .76rem; color: var(--muted); margin-top: 2px; }
.sylla .s .st { flex: none; align-self: center; }

/* 教材・バックナンバー */
.mat-list .m, .bn-list .b {
  display: flex; gap: 12px; align-items: center;
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff;
}
.mat-list .m + .m, .bn-list .b + .b { margin-top: 8px; }
.mat-list .m .ic, .bn-list .b .ic { font-size: 1.2rem; flex: none; }
.mat-list .m .t { flex: 1; min-width: 0; }
.mat-list .m .t .mt { font-size: .9rem; font-weight: 600; }
.mat-list .m .t .mk { font-size: .74rem; color: var(--muted); }
.bn-list .b { text-decoration: none; color: inherit; cursor: pointer; transition: background .15s; }
.bn-list .b:hover { background: var(--card-hover); }
.bn-list .b .t { flex: 1; min-width: 0; }
.bn-list .b .t .bt { font-size: .88rem; font-weight: 600; }
.bn-list .b .t .bd { font-size: .74rem; color: var(--faint); }
.bn-list .b .kinds { display: flex; gap: 6px; flex: none; }
</style>
</head>
<body class="campus-theme">
<div class="frame-container">
  <div class="frame-container-top">
    <div id="app-header"></div>
    <div id="sem-root"></div>
    <div id="app-footer"></div>
  </div>
</div>
<div class="layout-background"></div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
Shell.init({ page: "seminars", title: "ゼミ詳細" });

const params = new URLSearchParams(location.search);
const semId = parseInt(params.get("id"), 10);
const sem = SEMINARS.find(s => s.id === semId);

const STATUS_COLOR = { "進行中": "#2e7d32", "企画中": "#b26e0e", "終了": "#9e9e9e" };
const STYLE_LABEL = { zoom: "オンライン (Zoom)", hybrid: "ハイブリッド", "face-to-face": "対面" };
const MAT_ICON = { "教科書": "📕", "論文": "📄", "書籍": "📗", "資料": "📑", "ツール": "🛠", "環境": "💻", "データ": "🗂", "演習": "✏️", "フレームワーク": "🧩", "ケース": "📊", "機材": "🔧", "部品": "🔩", "ソフト": "💿", "規格": "📐", "参考": "🔖", "条約": "⚖", "法令": "📜", "実習": "🧪" };

if (!sem) {
  location.href = "seminars.html";
} else {
  render();
}

function fmtDate(iso) {
  if (!iso) return "日程調整中";
  const [y, m, d] = iso.split("-").map(Number);
  return `${y}年${m}月${d}日`;
}

function render() {
  const joined = user && user.seminars.includes(sem.id);
  const done = (sem.syllabus || []).filter(x => x.done).length;
  const total = (sem.syllabus || []).length;
  const nextIdx = (sem.syllabus || []).findIndex(x => !x.done);

  // 参加/資料ボタン
  let cta = "";
  if (sem.status === "終了") {
    cta = `<span class="chip grey">終了したゼミ</span> <span style="font-size:.82rem;color:var(--muted)">下記のバックナンバーから資料を閲覧できます</span>`;
  } else if (user) {
    cta = `<button class="border-button ${joined ? "" : "primary"}" id="join-btn">${joined ? "参加中 ✓（退出する）" : "このゼミに参加する"}</button>`;
    if (sem.status === "企画中") cta += ` <span style="font-size:.82rem;color:var(--muted)">※ 企画中のゼミです。参加登録で開講時に通知が届きます</span>`;
  } else {
    cta = `<a class="border-button primary" href="login.html">ログインして参加</a>`;
  }

  // 講義スケジュール
  const syllaHTML = total ? sem.syllabus.map((x, i) => {
    const cls = x.done ? "done" : (i === nextIdx ? "next" : "");
    const st = x.done
      ? '<span class="chip purple">実施済み</span>'
      : (i === nextIdx && x.date ? '<span class="chip green">次回</span>' : '<span class="chip outline">予定</span>');
    return `<div class="s ${cls}">
      <div class="no">${String(x.n).padStart(2, "0")}</div>
      <div class="c"><div class="tp">${esc(x.topic)}</div><div class="dt">🗓 ${fmtDate(x.date)}</div></div>
      <div class="st">${st}</div>
    </div>`;
  }).join("") : '<p style="color:var(--muted);font-size:.85rem">スケジュールは調整中です。</p>';

  // 使用教材
  const matHTML = (sem.materials || []).map(m => `<div class="m">
    <span class="ic">${MAT_ICON[m.type] || "📎"}</span>
    <div class="t"><div class="mt">${esc(m.title)}</div><div class="mk">${esc(m.type)}</div></div>
  </div>`).join("");

  // バックナンバー
  const bnHTML = (sem.backnumbers || []).length
    ? sem.backnumbers.map(b => `<a class="b" data-bn>
        <span class="ic">🎞</span>
        <div class="t"><div class="bt">${esc(b.title)}</div><div class="bd">🗓 ${fmtDate(b.date)}</div></div>
        <span class="kinds">${b.kinds.map(k => `<span class="chip outline">${esc(k)}</span>`).join("")}</span>
      </a>`).join("")
    : '<p style="color:var(--muted);font-size:.85rem">まだ公開されたバックナンバーはありません。</p>';

  document.getElementById("sem-root").innerHTML = `
    <div class="sem-wrap"><a class="single-line-link" href="seminars.html">← ゼミ一覧</a></div>

    <div class="card sem-head sem-wrap">
      <div class="hero">
        ${seminarVisualHTML(sem)}
        <span class="status-badge" style="background:${STATUS_COLOR[sem.status] || "#9e9e9e"}">${esc(sem.status)}</span>
      </div>
      <div class="h-body">
        <div class="h-id">SEMINAR #${String(sem.id).padStart(2, "0")}</div>
        <h1>${esc(sem.name)}</h1>
        <div class="meta">${seminarChipsHTML(sem)}<span class="chip outline">${esc(sem.field)}</span></div>
        <p class="ov">${esc(sem.overview || sem.description)}</p>
        <div class="cta">${cta}</div>
      </div>
    </div>

    <div class="card block sem-wrap">
      <h2>開催概要</h2>
      <div class="info-grid">
        <div class="row"><span class="k">開催形式</span><span class="v">${esc(STYLE_LABEL[sem.style] || sem.style)}</span></div>
        <div class="row"><span class="k">開催頻度</span><span class="v">${esc(sem.schedule)}</span></div>
        <div class="row"><span class="k">期間区分</span><span class="v">${esc(sem.span)}</span></div>
        <div class="row"><span class="k">分野</span><span class="v">${esc(sem.field)}</span></div>
        <div class="row"><span class="k">主催</span><span class="v">${esc(sem.organizer || "ASE-Lab.")}</span></div>
        <div class="row"><span class="k">参加者</span><span class="v">${sem.members}名</span></div>
        <div class="row"><span class="k">進捗</span><span class="v">${total ? `全${total}回中 ${done}回 実施済み` : "調整中"}</span></div>
        <div class="row"><span class="k">ステータス</span><span class="v">${esc(sem.status)}</span></div>
      </div>
    </div>

    <div class="card block sem-wrap">
      <h2>講義スケジュール <span class="sub">全${total || "—"}回</span></h2>
      <div class="sylla">${syllaHTML}</div>
    </div>

    <div class="card block sem-wrap">
      <h2>使用教材</h2>
      <div class="mat-list" style="margin-top:12px">${matHTML || '<p style="color:var(--muted);font-size:.85rem">教材は準備中です。</p>'}</div>
    </div>

    <div class="card block sem-wrap">
      <h2>教材バックナンバー <span class="sub">実施済みの回の資料</span></h2>
      <div class="bn-list" style="margin-top:12px">${bnHTML}</div>
    </div>`;

  const jb = document.getElementById("join-btn");
  if (jb) jb.addEventListener("click", () => {
    const i = user.seminars.indexOf(sem.id);
    if (i >= 0) { user.seminars.splice(i, 1); Store.save(user); toast("ゼミを退出しました"); }
    else {
      user.seminars.push(sem.id);
      user.seminarsTaken += 1;
      Store.save(user);
      addScore(10);
      if (user.seminars.length >= 3) grantBadge("seminar-3");
    }
    render();
    Shell.renderAccountArea();
  });

  document.querySelectorAll("[data-bn]").forEach(el =>
    el.addEventListener("click", () => toast("資料の閲覧は本実装で提供予定です（モック）")));
}
</script>
</body>
</html>
